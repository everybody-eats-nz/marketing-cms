# Dependabot configuration
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2

updates:
  # JavaScript / TypeScript dependencies (pnpm)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Pacific/Auckland"
    open-pull-requests-limit: 10
    labels:
      - dependencies
    # CI enforces pnpm's minimumReleaseAge supply-chain policy (24h), which
    # Dependabot's own resolver ignores - without a cooldown it proposes
    # hours-old releases that CI then rejects (see PR #111). Two days keeps
    # proposals comfortably past the policy window.
    cooldown:
      default-days: 2
    ignore:
      # 1.11.2 switched Next 16 + Turbopack builds to native debug IDs and runs
      # `sourcemap upload` without injecting first. Turbopack leaves some server
      # chunks without a debug ID, so the upload aborts with "Chunk ID not found"
      # and fails the deploy's `next build`. package.json pins 1.11.1; drop this
      # entry (and the pin) once a release fixes it. Only the deploy build has
      # the upload secrets, so CI can't catch a regression here.
      - dependency-name: "@posthog/nextjs-config"
        versions: ["1.11.2"]
    # Group related updates into a single PR to cut review noise.
    groups:
      payload:
        patterns:
          - "@payloadcms/*"
          - "payload"
      next:
        patterns:
          - "next"
          - "@next/*"
          - "eslint-config-next"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch

  # GitHub Actions used in workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Pacific/Auckland"
    labels:
      - dependencies
      - github-actions
    groups:
      actions:
        patterns:
          - "*"

  # Docker base image
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Pacific/Auckland"
    labels:
      - dependencies
      - docker
